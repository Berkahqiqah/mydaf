media:
  input: public/uploads
  output: /uploads
content:
  - name: settings
    label: Pengaturan Situs
    type: file
    path: content/settings.json
    format: json
    fields:
      - { name: name, label: Nama bisnis, type: string }
      - { name: domain, label: Alamat situs, type: string }
      - { name: city, label: Kota, type: string }
      - { name: wa, label: Nomor WhatsApp (format 62xxx), type: string }
      - { name: phone, label: Telepon tampilan, type: string }
      - { name: email, label: Email, type: string }
      - { name: address, label: Alamat, type: text }
      - { name: areas, label: Area layanan, type: string, list: true }
      - { name: social, label: Link sosial media, type: string, list: true }
      - { name: partners, label: Mitra / instansi, type: string, list: true }
      - name: reviews
        label: Testimoni
        type: object
        list: true
        fields:
          - { name: n, label: Nama pelanggan, type: string }
          - { name: t, label: Isi testimoni, type: text }
  - name: layanan
    label: Layanan
    type: collection
    path: content/layanan
    fields:
      - { name: name, label: Nama layanan, type: string }
      - { name: kw, label: Judul SEO (mis. Nasi Box Bandung), type: string }
      - { name: d, label: Deskripsi singkat, type: text }
      - { name: order, label: Urutan, type: number }
      - { name: f, label: Keunggulan, type: string, list: true }
      - name: q
        label: FAQ layanan
        type: object
        list: true
        fields:
          - { name: q, label: Pertanyaan, type: string }
          - { name: a, label: Jawaban, type: text }
  - name: produk
    label: Produk
    type: collection
    path: content/produk
    fields:
      - { name: title, label: Nama produk, type: string }
      - { name: price, label: Harga (mis. Rp 35.000), type: string }
      - { name: image, label: Foto, type: image }
      - { name: d, label: Deskripsi, type: text }
  - name: blog
    label: Artikel Blog
    type: collection
    path: content/blog
    fields:
      - { name: title, label: Judul, type: string }
      - { name: d, label: Deskripsi SEO (maks 155 huruf), type: text }
      - { name: date, label: Tanggal, type: date }
      - { name: body, label: Isi artikel, type: rich-text }
  - name: tentang
    label: Halaman Tentang Kami
    type: file
    path: content/halaman/tentang-kami.md
    fields:
      - { name: title, label: Judul, type: string }
      - { name: body, label: Isi halaman, type: rich-text }